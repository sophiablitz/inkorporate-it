<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Pad</title>
<style>
  :root { --bg: #eceef4; --fg: #1d1f24; --muted: #5d6270; --paper: #f8f6fc; --ok: #1e7d3a; --bad: #b3261e; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; padding: 12px 16px; gap: 8px; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #status { font-weight: 600; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); }
  canvas { background: var(--paper); border: 1px solid #c9ccd6; border-radius: 8px; touch-action: none;
           height: min(80vh, 900px); max-width: 100%; aspect-ratio: 1080 / 2170; cursor: crosshair; }
  small { color: var(--muted); }
</style>
</head>
<body>
<header>
  <strong>Relay Pad</strong>
  <span id="status">connecting…</span>
  <label>Color <input id="color" type="color" value="#1565c0"></label>
  <button id="clear">Clear</button>
</header>
<small>Pretends to be a second phone (1080×2170 canvas, same pixels as the emulator). Strokes stream live both ways; late joiners get the current canvas.</small>
<canvas id="pad" width="1080" height="2170"></canvas>
<script>
const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
const statusEl = document.getElementById("status");

// Finished strokes, plus strokes still being streamed in (keyed by id). Both are
// rendered every frame so a remote drawing appears live, point by point.
const strokes = [];
const live = new Map(); // id -> stroke being streamed from another client
let ws;

function connect() {
  ws = new WebSocket("ws://localhost:8080/relay");
  ws.onopen = () => { statusEl.textContent = "connected"; statusEl.className = "ok"; };
  ws.onclose = () => { statusEl.textContent = "disconnected, retrying…"; statusEl.className = "bad"; setTimeout(connect, 1500); };
  ws.onmessage = (e) => { try { handle(JSON.parse(e.data)); } catch {} };
}

// Apply one incoming protocol message. Handles the live-streaming protocol
// (begin/points/end/clear), the catch-up snapshot, and a legacy full stroke.
function handle(m) {
  switch (m.type) {
    case "snapshot":
      strokes.length = 0;
      live.clear();
      (m.strokes || []).forEach((s) => strokes.push(s));
      redraw();
      break;
    case "begin":
      live.set(m.id, { brush: m.brush, color: m.color, size: m.size, epsilon: m.epsilon, points: [] });
      break;
    case "points": {
      const s = live.get(m.id);
      if (s && m.points) { s.points.push(...m.points); redraw(); }
      break;
    }
    case "end": {
      const s = live.get(m.id);
      if (s) { strokes.push(s); live.delete(m.id); redraw(); }
      break;
    }
    case "clear":
      strokes.length = 0;
      live.clear();
      redraw();
      break;
    default:
      // Legacy single-frame stroke: a full stroke with points and no type.
      if (m.points) { strokes.push(m); draw(m); }
  }
}

const argbToCss = (c) => {
  const u = c >>> 0;
  return `rgba(${(u >> 16) & 255},${(u >> 8) & 255},${u & 255},${((u >>> 24) & 255) / 255})`;
};

function draw(s) {
  if (!s.points?.length) return;
  ctx.strokeStyle = argbToCss(s.color);
  ctx.globalAlpha = s.brush === "Highlighter" ? 0.4 : 1;
  ctx.lineWidth = s.size; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash(s.brush === "Dashed Line" ? [s.size * 3, s.size * 2] : []);
  ctx.beginPath();
  s.points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  if (s.points.length === 1) ctx.lineTo(s.points[0].x + 0.1, s.points[0].y);
  ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]);
}

function redraw() {
  ctx.clearRect(0, 0, pad.width, pad.height);
  strokes.forEach(draw);
  live.forEach(draw);
  if (current) draw(current);
}

// Drawing: convert mouse/touch position to canvas pixels, and stream the stroke live
// (begin -> points -> end) so other screens see it being drawn, not just the result.
let current = null, currentId = null, t0 = 0;
const send = (msg) => { if (ws?.readyState === 1) ws.send(JSON.stringify(msg)); };
const newId = () => `pad-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
const toCanvas = (e) => {
  const r = pad.getBoundingClientRect();
  return { x: (e.clientX - r.left) * pad.width / r.width, y: (e.clientY - r.top) * pad.height / r.height };
};
pad.addEventListener("pointerdown", (e) => {
  pad.setPointerCapture(e.pointerId);
  const hex = document.getElementById("color").value;
  const color = (0xFF000000 | parseInt(hex.slice(1), 16)) | 0;
  currentId = newId();
  current = { brush: "Marker", color, size: 12, epsilon: 0.1, points: [] };
  t0 = e.timeStamp;
  send({ type: "begin", id: currentId, brush: current.brush, color, size: current.size, epsilon: current.epsilon });
  add(e);
});
pad.addEventListener("pointermove", (e) => { if (current) add(e); });
pad.addEventListener("pointerup", () => {
  if (!current) return;
  strokes.push(current);
  send({ type: "end", id: currentId });
  current = null; currentId = null;
  redraw();
});
function add(e) {
  const p = toCanvas(e), last = current.points.at(-1);
  if (last && last.x === p.x && last.y === p.y) return;
  const point = { x: p.x, y: p.y, t: Math.round(e.timeStamp - t0) };
  current.points.push(point);
  send({ type: "points", id: currentId, points: [point] });
  redraw();
}
document.getElementById("clear").onclick = () => {
  strokes.length = 0; live.clear(); redraw();
  send({ type: "clear" });
};
connect();
</script>
</body>
</html>
